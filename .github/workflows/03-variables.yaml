name: 08-Working with variables
run-name: Working with Variables | ${{ vars.TARGET_VAR && 'TRUE' || 'FALSE' }}
on: 
    push:
    workflow_dispatch:
    
env:
    WORKFLOW_VAR: "I am a workflow var"
    OVERWRITTEN:  "I will be overwritten"
    UNDEFINED_VAR_WITH_DEFAULT: ${{ vars.UNDEFINED_VAR || 'default-value' }}

jobs:
    echo:
        runs-on: ubuntu-latest
        env:
            JOB_VAR: "I am a job env var"
            OVERWRITTEN: "I have been overwritten at the job level"
        steps:
          - name: Print ENV variables
            env: 
                STEP_VAR: "I am astep env var"
                step_var2: "I am at another step var"
            run: |
                echo "Step env var: ${{ env.STEP_VAR }}"
                echo "Step env var2: ${{ env.step_var2 }}"
                echo "Job env var: ${{ env.JOB_VAR }}"
                echo "Workflow env var: ${{ env.WORKFLOW_VAR }}"
                echo "Overwritten: ${{ env.OVERWRITTEN }}"

          - name: Overwrite Job variable
            env:
                OVERWRITTEN: "I have been overwritten at the step level"
            run: |
              echo "Step env var: ${{ env.OVERWRITTEN }}"
    echo2:
        runs-on: ubuntu-latest
        steps:
          - name: Print Variables
            run: |
                echo "Repo_var: ${{ vars.REPOSITORY_VAR }}"

    echo-prod:
        runs-on: ubuntu-latest
        environment: prod
        steps:
          - name: Print Prod Variables
            run: |
                echo "Repo_var: ${{ vars.REPOSITORY_VAR }}"
                echo "Environment_var: ${{ vars.TARGET_VAR }}"
    echo-undefined:
        runs-on: ubuntu-latest
        steps:
          - name: Print Undefined variables
            run: |
                echo "Org_var: ${{ env.UNDEFINED_VAR_WITH_DEFAULT }}"