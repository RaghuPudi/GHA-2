name: Practising with outputs
run-name: 07-Inspect the outputs
on:
    workflow_dispatch:
        inputs:
            build-status:
                type: choice
                options:
                    - success
                    - failure
                default: success

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Print GITHUB_OUTPUT path
              run: echo $GITHUB_OUTPUT

            - name: build
              id: build
              run: echo "status=${{ inputs.build-status }} >> "GITHUB_OUTPUT" "
              outputs:
                build-status: ${{ steps.build.outputs.status }}
    deploy:
        runs-on: ubuntu-latest
        needs: build
        if: ${{ steps.build.outputs.status == 'success' }}
        steps:
            - name: Deploy
              run: "Deploying"
