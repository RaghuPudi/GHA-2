name: Caching and Artifacts
run-name: Experimenting with Caching and Artifacts
on:
    workflow_dispatch:
env:
    build-artifact-key: app-${{ github.sha }}
    download-artifact-key: app-${{ github.sha }}
jobs:
    test-build:
        runs-on: ubuntu-latest 
        defaults:
            run:
                working-directory: 09-artifacts/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with: 
                fetch-depth: 0 
            
            - name: Setup Node
              uses: actions/setup-node@v7
              with: 
                node-version: '24.0'
            - name: Download Cache Dependencies
              id: cache
              uses: actions/cache@v6
              with:
                path: 09-cache/node-modules
                key: deps-node-modules-${{ hashFiles('09-artifacts/react-app/package-lock.json') }}

            - name: Install the cache dependencies
              if: ${{ steps.cache.outputs.cache-hit != 'true'}}
              run: npm ci 

            - name: Upload Build files
              uses: actions/upload-artifacts@v7
              with: 
                name: ${{ env.build-artifact-key }}
                path: 09-caching/react-app/build
    deploy:
        runs-on: ubuntu-latest
        needs: test-build
        steps:
            - name: Download Build files
              uses: actions/download@v7
              with:
                name: ${{ env.download-artifact-key }}
                path: build 
            - name: Show folder structure
              run: ls -R



