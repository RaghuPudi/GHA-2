name: Controlling the execution flow
run-name: 10-Experimenting and controlling the execution flow | ${{ inputs.pass-unit-tests && 'true' || 'false' }}

on:
    workflow_dispatch:
        inputs:
            pass-unit-tests:
                type: boolean
                description: Whether the Unit tests will pass or not
                default: true 

jobs:
    lint-build:
        runs-on: ubuntu-latest
        steps:
            - name: Lint and Build
              run: echo "Linting and Building the Project"
    
    unit-tests:
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - name: Running unit tests
              run: echo "Run the Unit tests"
            
            - name: Failing tests
              if: ${{ !inputs.pass-unit-tests  }}
              run: exit 1

    deploy-non-prod:
        runs-on: ubuntu-latest
        needs: [ lint-build , unit-tests ]
        steps:
            - name: deploying to non prod
              run: echo "DEploy to non-prod"

    e2e-tests: 
        runs-on: ubuntu-latest
        needs: deploy-non-prod
        steps:
            - name: Run the e2e-tests
              run: echo "Run the e2e-tests"

    load-tests:
        runs-on: ubuntu-latest
        needs: deploy-non-prod
        steps:
            - name: Load the Test
              run: echo "Run the load tests"
    
    deploy-prod:
        runs-on: ubuntu-latest
        needs: [ e2e-tests, load-tests ]
        steps:
            - name: deploy to prod
              run: echo "Deploying to Prod"

