name: 02- Experimenting with the expressions
run-name: Using the expressions | DEBUG- ${{ inputs.debug && 'ON' || 'OFF'}}

on:
    push:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false

jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
          - name: Print Startup data
            if: ${{ inputs.debug }}
            run: |
              echo "Triggered by: ${{ github.event_name }}
              echo "Branch: ${{ github.ref }}
              echo "Commit: ${{ github.sha }}
              echo "Runner-OS: ${{ runner.os }}
          - name: Print triggered from main
            if: ${{ inputs.debug && github.ref == 'refs/heads/main }}
            run: |
               echo "I am triggered from main"
          - name: Print Hello world
            run: echo "Hello World"
