name: Practising the reuseable workflows
run-name: Reuseable Workflows-reuseable definition
on:
    workflow_call:
        inputs:
            target-directory:
                type: string 
                required: true
        outputs:
            build-status:
                description: Get the buildstatus
                value: ${{ jobs.build.outputs.build-status }}
            url:
                description: Get the URL
                value: ${{ jobs.deploy.outputs.url }}


jobs:
    deploy:
        runs-on: ubuntu-latest
        outputs:
            build-status: ${{ steps.build.outputs.build-status }}
            url: ${{ steps.deploy.outputs.url }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Building the code 
              id: build
              run: |
                echo "Building using directory:${{ inputs.target-directory }}"
                echo "build-status=success" >> "$GITHUB_OUTPUT"
            - name: DEploy the code 
              id: deploy
              run: |
                echo "Deploying the code"
                echo "url=https://www.google.com" >> "$GITHUB_OUTPUT"
