name: Working with Caching 
run-name: Experimenting with caching | ${{ inputs.node-version && inputs.use-cache || 'No-caching'  }}
on:
    workflow_dispatch:
        inputs:
            use-cache:
                type: boolean
                description: Whether to execute the cache step
                default: true

            node-version:
                type: choice
                description: Select the node version 
                options: 
                    - 18.x
                    - 20.x
                    - 24.x
                default: '24.x'

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: 08-cache.yaml/react-app
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Setup-node
              uses: actions/setup-node@v7
              with:
                node-version: ${{ inputs.node-version }}

            - name: Download the dependencies
              if: ${{ inputs.use-cahe }}
              uses: actions/cache@v6
              id: cache
              with: 
                path: node-modules
                key: deps-modules-${{ hashFiles('08-cache/react-app/package-lock.json') }}

            - name: Install the dependencies
              if: ${{ steps.cache.outputs.cache-hit != 'true' }}
              run: npm ci 
            
            - name: Run the testing 
              run: npm test 

            - name: Building the code
              run: npm run build 

            - name: DEploying to non-prod
              run: echo "Deploy to non-prod"


    install-deps:
        runs-on: ubuntu-latest
        outputs:
            deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY }}
        defaults:
            run:
                working-directory: 08-caching/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Setup node
              uses: actions/setup-node@v7
              with:
                node-version: ${{ inputs.node-version }}

            - name: Calculate cache key 
              id: cache-key
              run: echo "CACHE_KEY=deps-node-modules-${{ hashFiles('08-caching/react-app') }}" >> "$GITHUB_OUTPUT"

            - name: Install the dependencies
              if: ${{ steps.cache.outputs.cache-hit != 'true' }}
              run: npm ci 

    linting:
        runs-on: ubuntu-latest
        needs: install-deps
        defaults:
            run:
                working-directory: 08-caching/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                 node-version: ${{ inputs.node-version }}

            - name: Download the dependencies
              id: cache
              with:
                path: 08-caching/react-app
                key: ${{ needs.install-deps.outputs.deps-cache-key }}
              
